<!-- Inter is only used for the name. Loaded as a blocking stylesheet it
     holds up the first paint of the page you are transitioning INTO, which
     shows up as a pause before the morph starts. This loads it out of band
     and applies it when it arrives; Helvetica carries the page until then. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"
      media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"></noscript>
<link rel="stylesheet" href="style.css?v=78">
<link rel="stylesheet" href="work.css?v=78">
<script>
  /* Arriving through a view transition, the page must not also perform its
     entrance stagger: the morph and a page-wide fade-and-rise run at the same
     time and fight each other. This has to be set before first paint, so it
     is inline in the head rather than in a file.

     The clearing matters as much as the setting. These pages come back from
     the back/forward cache with their DOM exactly as it was left — including
     the is-leaving class that was added to kill the 3D context on the way out.
     Left in place it permanently disables the card hover on the page you
     return to. */
  window.addEventListener('pagereveal', function (e) {
    if (!e.viewTransition) return;
    var root = document.documentElement;
    root.classList.add('is-arriving');
    /* Going back is a different move from going in, so it gets a different
       animation. Either the browser tells us (a real back/forward traverse)
       or the page we left did, on its way out. */
    var flag = false;
    try { flag = sessionStorage.getItem('md-back') === '1'; } catch (err) {}
    try { sessionStorage.removeItem('md-back'); } catch (err) {}

    /* Only the index and Explorations can be arrived AT backwards; a project
       page is always somewhere you went to. Checking that stops the flag a
       project page sets on its way out from being read by the next project
       page along. */
    var here = location.pathname.split('/').pop() || 'index.html';
    var isIndex = here === 'index.html' || here === 'explorations.html';

    var back = flag && isIndex;

    /* Safari has no Navigation API, so navigation.activation cannot be relied
       on for the direction — which is why this was never firing. The flag is
       set by the page being left, on pagehide, which happens for every way of
       leaving including the browser's own back button. */
    if (!back && isIndex && window.navigation && navigation.activation) {
      back = navigation.activation.navigationType === 'traverse';
    }
    if (back) root.classList.add('is-back');

    /* is-back is cleared when the transition has finished, NOT on pageshow.
       On a back/forward-cache restore pageshow fires immediately — while the
       animation is still running — and stripping the class mid-flight pulls
       the rules out from under it, so it cancels and the page snaps into
       place. The catch is there because the browser skips the transition
       outright in some cases and an unhandled rejection is noise. */
    /* ready rejects too when the transition is skipped, and nothing here
       reads it — an untouched rejected promise is reported as an unhandled
       error, which is where "AbortError: Transition was skipped" in the
       console came from. */
    if (e.viewTransition.ready) e.viewTransition.ready.catch(function () {});
    e.viewTransition.finished
      .catch(function () {})
      .then(function () { root.classList.remove('is-back'); });
  });
  window.addEventListener('pageshow', function () {
    /* is-arriving is NOT cleared here. It suppresses the entrance stagger, and
       removing it mid-life flips [data-rise] from animation:none back to the
       rise keyframes — which restarts them, fading the whole page in again
       just after the morph has landed. That is the blink. It only needs
       clearing for a page coming back from the bfcache, which gets a fresh
       pagereveal anyway. */
    /* Only the leftover card state is cleared here. is-arriving stays for the
       life of the page and is-back is cleared by the transition itself. */
    try { sessionStorage.removeItem('md-back'); } catch (err) {}
    document.querySelectorAll('.is-leaving').forEach(function (el) {
      el.classList.remove('is-leaving');
    });
  });
</script>
